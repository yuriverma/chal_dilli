# Render blueprint — the host for this backend.
#
# Hugging Face Spaces cannot host it on a free account. Creating a Gradio (or
# Docker) Space on cpu-basic returns 402:
#
#   Static Spaces are free for everyone, but hosting Gradio and Docker Spaces
#   on free cpu-basic requires a PRO subscription.
#
# Only Static Spaces are free, and a static host cannot run Python. Downgrading
# an existing Space to cpu-basic is refused for the same reason, so there is no
# way around it without PRO. app.py and the Gradio UI are kept because they are
# useful locally and on any host that does allow it, but nothing here needs them.
#
# The cost of Render's free tier is that an instance idles down after
# inactivity, so the first request after a quiet spell waits for a cold boot.
# The frontend handles that explicitly rather than reporting an outage: a failed
# request polls /init-status and says "waking up".
services:
  - type: web
    name: chal-dilli-backend
    env: python
    plan: free

    # Playwright is deliberately NOT installed here. It is only needed by the
    # two Parse.bot event endpoints, which already return 503 when
    # PARSEBOT_API_KEY is unset -- and without a key they cannot work anyway.
    # Installing chromium costs several minutes and ~150MB on every deploy for
    # no benefit. To enable events, add a key below and append:
    #   && playwright install chromium && playwright install-deps chromium || true
    buildCommand: pip install -r requirements.txt

    # Single worker on purpose -- conversation state lives in process memory.
    # See the comment in the Dockerfile.
    startCommand: uvicorn backend.api_server:app --host 0.0.0.0 --port $PORT

    # Readiness, not liveness: the routing graphs take a few seconds to build.
    # /health stays 200 throughout and reports "starting" until they are up.
    healthCheckPath: /health

    envVars:
      # Pinned, not left to the platform default. pandas 3.x requires Python
      # >= 3.11, and an unpinned interpreter is exactly what broke the first
      # three Hugging Face builds — the image there was 3.10 and pip could not
      # see any matching pandas at all. .python-version pins it too; this is
      # belt and braces because the two mechanisms differ per platform.
      - key: PYTHON_VERSION
        value: "3.12"
      # Given a real value rather than `sync: false`. Render treats a
      # sync:false variable as required and blocks the deploy until you type
      # something, which is wrong for a variable that is designed to be
      # optional -- it turned "deploy this blueprint" into a form with three
      # mandatory fields and an error banner.
      #
      # "*" is what the code falls back to when this is unset: all origins,
      # without credentials. Fine for a public read-only API. Narrow it to the
      # frontend's origin in the Render dashboard once the frontend is up.
      - key: ALLOWED_ORIGINS
        value: "*"

      # ADMIN_TOKEN and PARSEBOT_API_KEY are deliberately absent, not blank.
      # Both are secrets, so they belong in the dashboard rather than in a
      # file in the repo, and the app has a defined behaviour without either:
      #
      #   ADMIN_TOKEN unset       -> POST /update-data returns 404, so the
      #                              scrape trigger is not exposed at all
      #   PARSEBOT_API_KEY unset  -> the two event endpoints return 503 and
      #                              everything else works normally
      #
      # Add them under Environment in the service settings if you want those
      # features.
