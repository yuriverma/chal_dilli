services:
  - type: web
    name: chal-dilli-api
    env: python
    pythonVersion: "3.11"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: cd backend && python -m uvicorn api_server:app --host 0.0.0.0 --port ${PORT:-8000}
    envVars:
      - key: PORT
        sync: false

