# Render blueprint — the FALLBACK host, kept working but not the primary.
#
# Hugging Face Spaces is the primary target (see the Dockerfile and the deploy
# section of the README). A free Render instance idles down after inactivity,
# so the first visitor after a quiet spell waits for a cold boot, and for a
# chat app that is the whole first impression.
#
# This file briefly recommended Render over Spaces because
# data/GTFS/stop_times.csv was 76MB, over the per-file limit for non-LFS files
# on a Space's git remote. That file is gone — the derived graph in
# bus_edges.csv replaced it — so Spaces now takes a plain git push and the
# reason no longer applies.
services:
  - type: web
    name: chal-dilli-backend
    env: python
    plan: free

    # Playwright is deliberately NOT installed here. It is only needed by the
    # two Parse.bot event endpoints, which already return 503 when
    # PARSEBOT_API_KEY is unset -- and without a key they cannot work anyway.
    # Installing chromium costs several minutes and ~150MB on every deploy for
    # no benefit. To enable events, add a key below and append:
    #   && playwright install chromium && playwright install-deps chromium || true
    buildCommand: pip install -r backend/requirements.txt

    # Single worker on purpose -- conversation state lives in process memory.
    # See the comment in the Dockerfile.
    startCommand: uvicorn backend.api_server:app --host 0.0.0.0 --port $PORT

    # Readiness, not liveness: the routing graphs take a few seconds to build.
    # /health stays 200 throughout and reports "starting" until they are up.
    healthCheckPath: /health

    envVars:
      # Set this to the deployed frontend origin once it exists. Until then the
      # backend allows all origins without credentials, which is fine for a
      # public read-only API but should be tightened.
      - key: ALLOWED_ORIGINS
        sync: false
      # Leave unset and POST /update-data 404s instead of exposing a scrape
      # trigger to the internet.
      - key: ADMIN_TOKEN
        sync: false
      # Leave unset and the two event endpoints return 503. Everything else
      # works normally.
      - key: PARSEBOT_API_KEY
        sync: false
