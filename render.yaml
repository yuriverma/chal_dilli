services:
  - type: web
    name: chal-dilli-backend
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && playwright install chromium && playwright install-deps chromium || true
    startCommand: uvicorn backend.api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        sync: false
